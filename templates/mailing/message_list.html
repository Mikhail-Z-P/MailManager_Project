{% extends "base.html" %}

{% block title %}Сообщения{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Сообщения</h1>
    <a href="{% url 'mailing:message_create' %}" class="btn btn-primary">Добавить</a>
</div>
<table class="table table-striped">
    <thead>
        <tr>
            <th>Тема</th>
            <th>Тело</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for message in message_list %}
        <tr>
            <td>{{ message.subject }}</td>
            <td>{{ message.body|truncatechars:50 }}</td>
            <td>
                <a href="{% url 'mailing:message_update' message.pk %}" class="btn btn-sm btn-warning">Изменить</a>
                <a href="{% url 'mailing:message_delete' message.pk %}" class="btn btn-sm btn-danger">Удалить</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3">Нет сообщений</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
