{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Вход{% endblock %}

{% block content %}
<h1>Вход</h1>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Войти</button>
    <a href="{% url 'users:password_reset' %}" class="btn btn-link">Забыли пароль?</a>
</form>
{% endblock %}
