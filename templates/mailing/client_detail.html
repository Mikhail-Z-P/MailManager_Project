{% extends "base.html" %}

{% block title %}Клиент{% endblock %}

{% block content %}
<h1>{{ client.full_name }}</h1>
<p><strong>Email:</strong> {{ client.email }}</p>
<p><strong>Комментарий:</strong> {{ client.comment }}</p>
<a href="{% url 'mailing:client_update' client.pk %}" class="btn btn-warning">Изменить</a>
<a href="{% url 'mailing:client_delete' client.pk %}" class="btn btn-danger">Удалить</a>
<a href="{% url 'mailing:client_list' %}" class="btn btn-secondary">Назад</a>
{% endblock %}
